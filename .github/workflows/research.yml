# 調べもの: 攻略サイトのページを取ってきて 本文だけ research ブランチに保存する（ゲームには関係しない）
name: research
on:
  push:
    branches: [research-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch pages
        run: |
          mkdir -p out && cd out
          cat > urls.txt <<'URLS'
          gv_main https://archero-2.game-vault.net/wiki/Main_Page
          gv_gear https://archero-2.game-vault.net/wiki/Gear
          gv_chars https://archero-2.game-vault.net/wiki/Characters
          gv_artifacts https://archero-2.game-vault.net/wiki/Artifacts
          gv_talent https://archero-2.game-vault.net/wiki/Talent_Cards
          gv_mech https://archero-2.game-vault.net/wiki/Game_Mechanics
          gv_currency https://archero-2.game-vault.net/wiki/Currency_and_Items
          gv_events https://archero-2.game-vault.net/wiki/Events
          gv_pull https://archero-2.game-vault.net/wiki/Pull_Rates
          gv_tips https://archero-2.game-vault.net/wiki/Collection_of_game_Tips
          gv_begin https://archero-2.game-vault.net/wiki/Ultimate_Beginners_Guide
          gv_chapters https://archero-2.game-vault.net/wiki/Chapters
          gv_monsters https://archero-2.game-vault.net/wiki/Monsters
          hub_gear https://archero2hub.com/en/gear
          hub_home https://archero2hub.com/en
          mobi_gear https://mobi.gg/en/tips/archero-2-gear/
          mobi_chapters https://mobi.gg/en/tips/archero-2-chapters/
          mobi_tips https://mobi.gg/en/tips/archero-2-tips/
          fandom_a2 https://archero-2.fandom.com/wiki/Archero_2_Wiki
          URLS
          sed -i 's/^ *//' urls.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" --max-time 40 "$url" -o "$name.html" || echo "FAIL $name" >> fail.txt
            echo "$name $url $(wc -c < "$name.html" 2>/dev/null)" >> sizes.txt
          done < urls.txt
          python3 - <<'PY'
          import glob, html, re
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.out=[]; s.skip=0
              def handle_starttag(s,t,a):
                  if t in ("script","style","noscript","svg"): s.skip+=1
                  if t in ("p","br","li","tr","h1","h2","h3","h4","div","td","th"): s.out.append("\n")
                  if t in ("td","th"): s.out.append(" | ")
              def handle_endtag(s,t):
                  if t in ("script","style","noscript","svg") and s.skip: s.skip-=1
              def handle_data(s,d):
                  if not s.skip: s.out.append(d)
          for f in glob.glob("*.html"):
              p=P(); p.feed(open(f,encoding="utf-8",errors="ignore").read())
              t=re.sub(r"[ \t]+"," ","".join(p.out)); t=re.sub(r"\n\s*\n+","\n",t)
              open(f[:-5]+".txt","w").write(t.strip()+"\n")
          PY
          rm -f *.html
      - name: push to research branch
        run: |
          cd out
          git init -q -b research
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "research pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" research
