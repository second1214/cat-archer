# フリー素材（CC0）: 作品ページの ライセンス・作者・ファイルを 取ってきて assets ブランチに保存（ゲームには関係しない）
name: assets
on:
  push:
    branches: [assets-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for a in interface-sounds/f84eee9fab-1677589472 impact-sounds/4ef56f2408-1677589755 music-jingles/5d3327d2da-1677590394; do
            n=${a%%/*}; mkdir -p "k_$n"
            curl -sSL -A "$UA" --max-time 40 "https://kenney.nl/assets/$n" -o "k_$n/page.html"
            grep -oiE '(href|data-[a-z-]+|action)="[^"]*(download|\.zip)[^"]*"' "k_$n/page.html" | sort -u > "k_$n/dl.txt"
            for z in "kenney_$n.zip" "kenney-$n.zip" "$n.zip"; do
              code=$(curl -sSL -A "$UA" --max-time 60 -o "k_$n/$z" -w "%{http_code}" "https://kenney.nl/media/pages/assets/$a/$z")
              echo "$z $code $(wc -c < "k_$n/$z")" >> "k_$n/try.txt"
              [ "$code" = 200 ] && unzip -l "k_$n/$z" > "k_$n/zip-list.txt" 2>&1 && break
              rm -f "k_$n/$z"
            done
            rm -f "k_$n/page.html"
          done
      - name: push
        run: |
          cd out
          git init -q -b assets
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "assets"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets
