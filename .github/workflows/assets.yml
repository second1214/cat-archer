# 調べもの（一時的）: 本家の プレイ動画から コマ画像を 取り出す。確認したら ブランチは 消す
name: assets
on:
  push:
    branches: [assets-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: frames
        run: |
          pip install -q yt-dlp
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p out && cd out
          for q in "archero 2 sword strike build" "archero 2 dragon strike rune" "archero 2 strike build gameplay"; do
            yt-dlp --flat-playlist --print "%(id)s|%(duration)s|%(title)s" "ytsearch6:$q" >> found.txt 2>>err.txt || true
          done
          sort -u found.txt -o found.txt
          # 長すぎ・短すぎを はぶいて 4本
          awk -F'|' '$2>90 && $2<1500' found.txt | head -4 > pick.txt
          n=0
          while IFS='|' read -r id dur title; do
            n=$((n+1))
            yt-dlp -q -f "bv*[height<=480][ext=mp4]/b[height<=480]" --download-sections "*60-100" -o "v$n.%(ext)s" "https://www.youtube.com/watch?v=$id" 2>>err.txt || continue
            f=$(ls v$n.* 2>/dev/null | head -1); [ -z "$f" ] && continue
            mkdir -p "v$n"
            ffmpeg -loglevel error -i "$f" -vf "fps=4,scale=270:-2" -q:v 5 "v$n/f%03d.jpg"
            echo "v$n|$id|$title" >> videos.txt
            rm -f "$f"
          done < pick.txt
          ls -R | head -50 > list.txt
      - name: push
        run: |
          cd out
          git init -q -b research-video
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "frames (temporary)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" research-video
