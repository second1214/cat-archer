# フリー素材（CC0）さがし: ページから ダウンロードの リンクと ライセンスを 集めて assets ブランチに保存（ゲームには関係しない）
name: assets
on:
  push:
    branches: [assets-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: list
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          cat > urls.txt <<'URLS'
          k_interface https://kenney.nl/assets/interface-sounds
          k_impact https://kenney.nl/assets/impact-sounds
          k_jingles https://kenney.nl/assets/music-jingles
          k_digital https://kenney.nl/assets/digital-audio
          k_rpg https://kenney.nl/assets/rpg-audio
          k_ui https://kenney.nl/assets/ui-audio
          k_game_icons https://kenney.nl/assets/game-icons
          oga_cute https://opengameart.org/art-search-advanced?keys=cute&field_art_type_tid%5B%5D=12&field_art_licenses_tid%5B%5D=4&sort_by=count&sort_order=DESC
          oga_happy https://opengameart.org/art-search-advanced?keys=happy&field_art_type_tid%5B%5D=12&field_art_licenses_tid%5B%5D=4&sort_by=count&sort_order=DESC
          oga_loop https://opengameart.org/art-search-advanced?keys=loop&field_art_type_tid%5B%5D=12&field_art_licenses_tid%5B%5D=4&sort_by=count&sort_order=DESC
          oga_insect https://opengameart.org/art-search-advanced?keys=insect&field_art_type_tid%5B%5D=9&field_art_licenses_tid%5B%5D=4&sort_by=count&sort_order=DESC
          oga_bug https://opengameart.org/art-search-advanced?keys=bug&field_art_type_tid%5B%5D=9&field_art_licenses_tid%5B%5D=4&sort_by=count&sort_order=DESC
          URLS
          sed -i 's/^ *//' urls.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "$UA" --max-time 40 "$url" -o "$name.html" || echo "FAIL $name" >> fail.txt
            echo "$name $(wc -c < "$name.html" 2>/dev/null)" >> sizes.txt
            # リンク（ダウンロード・作品ページ）と 題名・ライセンスの行
            grep -oE 'href="[^"]+"' "$name.html" | sed 's/href="//;s/"$//' | grep -E '\.zip|\.ogg|\.mp3|\.wav|/content/|/media/' | sort -u > "$name.links.txt"
            grep -oiE '(CC0|Creative Commons[^<]{0,40}|public domain)' "$name.html" | sort | uniq -c > "$name.lic.txt"
            grep -oE '<title>[^<]*' "$name.html" > "$name.title.txt"
          done < urls.txt
          rm -f *.html
      - name: push
        run: |
          cd out
          git init -q -b assets
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "asset links"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets
