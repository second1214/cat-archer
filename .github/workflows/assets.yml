# フリー素材（CC0）: 作品ページの ライセンス・作者・ファイルを 取ってきて assets ブランチに保存（ゲームには関係しない）
name: assets
on:
  push:
    branches: [assets-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          cat > pages.txt <<'URLS'
          musicbox https://opengameart.org/content/4-music-box-tracks
          lullaby https://opengameart.org/content/happy-lullaby-song17
          summer https://opengameart.org/content/summer-park-8bit-tune-loop
          tiki https://opengameart.org/content/enchanted-tiki-86
          cave https://opengameart.org/content/crystal-cave-song18
          jrpg https://opengameart.org/content/jrpg-pack-1-exploration
          bossmetal https://opengameart.org/content/boss-battle-2-symphonic-metal
          k_interface https://kenney.nl/assets/interface-sounds
          k_impact https://kenney.nl/assets/impact-sounds
          k_jingles https://kenney.nl/assets/music-jingles
          URLS
          sed -i 's/^ *//' pages.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            mkdir -p "$name"
            curl -sSL -A "$UA" --max-time 40 "$url" -o "$name/page.html"
            # ライセンス・作者
            grep -oiE '(CC0|CC-BY[^<"]{0,10}|CC-BY-SA[^<"]{0,10}|GPL[^<"]{0,10}|OGA-BY[^<"]{0,10}|public domain)' "$name/page.html" | sort | uniq -c > "$name/license.txt"
            grep -oE 'href="/users/[^"]+"' "$name/page.html" | sort -u | head -3 > "$name/author.txt"
            grep -oE '<title>[^<]*' "$name/page.html" > "$name/title.txt"
            # ファイル（音・zip）
            grep -oE '(https?://[^"'"'"' ]+|/[^"'"'"' ]+)\.(ogg|mp3|wav|zip)' "$name/page.html" | sort -u > "$name/files.txt"
            n=0
            while read -r f; do
              case "$f" in /*) base=$(echo "$url" | grep -oE '^https?://[^/]+'); f="$base$f";; esac
              n=$((n+1)); [ $n -gt 6 ] && break
              fn=$(basename "${f%%\?*}")
              curl -sSL -A "$UA" --max-time 120 --max-filesize 30000000 "$f" -o "$name/$fn" || rm -f "$name/$fn"
            done < "$name/files.txt"
            rm -f "$name/page.html"
            ls -la "$name" >> list.txt
          done < pages.txt
      - name: push
        run: |
          cd out
          git init -q -b assets
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "assets"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets
