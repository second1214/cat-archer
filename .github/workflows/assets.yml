# 調べもの: スカイタワーの ページを 取って 本文を research-more ブランチに保存（ゲームには関係しない）
name: assets
on:
  push:
    branches: [assets-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ curl -sSL -A "$UA" --max-time 40 "$2" -o "$1.html"; echo "$1 $2 $(wc -c < "$1.html")" >> sizes.txt; }
          get hub_home "https://archero2hub.com/en"
          grep -oE 'href="[^"]*"' hub_home.html | sed 's/href="//;s/"$//' | grep -iE 'talent|card|godforge|mystling|pet|scroll|gear-swap|egg|plant|engrav|etch|artifact' | sort -u | head -14 > hub_links.txt
          i=0; while read -r l; do i=$((i+1)); case "$l" in /*) l="https://archero2hub.com$l";; esac; get "hub_$i" "$l"; echo "hub_$i $l" >> hub_map.txt; done < hub_links.txt
          get gv_mystling "https://archero-2.game-vault.net/wiki/Mystlings"
          get gv_pets "https://archero-2.game-vault.net/wiki/Pets"
          get gv_godforge "https://archero-2.game-vault.net/wiki/Godforge"
          get gv_scroll "https://archero-2.game-vault.net/wiki/Gear"
          python3 - <<'PY'
          import glob, re
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.out=[]; s.skip=0
              def handle_starttag(s,t,a):
                  if t in ("script","style","noscript","svg"): s.skip+=1
                  if t in ("p","br","li","tr","h1","h2","h3","h4","div","td","th"): s.out.append("\n")
                  if t in ("td","th"): s.out.append(" | ")
              def handle_endtag(s,t):
                  if t in ("script","style","noscript","svg") and s.skip: s.skip-=1
              def handle_data(s,d):
                  if not s.skip: s.out.append(d)
          for f in glob.glob("*.html"):
              raw=open(f,encoding="utf-8",errors="ignore").read()
              if f.startswith("rd_"):
                  open(f[:-5]+".txt","w").write(raw); continue
              p=P(); p.feed(raw)
              t=re.sub(r"[ \t]+"," ","".join(p.out)); t=re.sub(r"\n\s*\n+","\n",t)
              open(f[:-5]+".txt","w").write(t.strip()+"\n")
          PY
          rm -f *.html
      - name: push
        run: |
          cd out
          git init -q -b research-more
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "tower pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" research-more
